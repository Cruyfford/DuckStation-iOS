name: iOS IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -n 1)"
          xcodebuild -version

      - name: Install build tools
        run: brew install ninja || true

      - name: Restore dependencies
        id: cache-deps
        uses: actions/cache/restore@v4
        with:
          path: deps-ios
          key: deps-ios-${{ hashFiles('scripts/deps/build-dependencies-ios.sh') }}

      - name: Build dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: bash scripts/deps/build-dependencies-ios.sh "$PWD/deps-ios"

      # Saved right away so later compile failures don't throw the (slow) dependency build away.
      - name: Save dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: deps-ios
          key: deps-ios-${{ hashFiles('scripts/deps/build-dependencies-ios.sh') }}

      - name: Configure
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.4 \
            -DCMAKE_PREFIX_PATH="$PWD/deps-ios" \
            -DCMAKE_FIND_ROOT_PATH="$PWD/deps-ios" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
            -DCMAKE_MACOSX_BUNDLE=OFF \
            -DBUILD_IOS_FRONTEND=ON

      - name: Build
        # -k 0: keep going so one run reports every compile error.
        run: cmake --build build --parallel "$(sysctl -n hw.ncpu)" -- -k 0

      - name: Package IPA
        run: bash scripts/ios/package-ipa.sh build deps-ios out/DuckStation.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: DuckStation-iOS
          path: out/DuckStation.ipa

      # Keep the latest IPA on the private 'builds' branch so it can be fetched with git.
      - name: Publish IPA to builds branch
        if: github.event_name != 'pull_request'
        run: |
          set -e
          mkdir -p /tmp/builds && cp out/DuckStation.ipa /tmp/builds/DuckStation.ipa
          cd /tmp/builds
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "Built from ${GITHUB_SHA}" > BUILD.txt
          git add -A && git commit -qm "DuckStation.ipa from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" builds
